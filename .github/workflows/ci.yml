name: TypeScript CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Reject dependency advisories
        run: npm audit --include=dev --audit-level=moderate

      - name: Verify publish gate
        run: npm run verify:publish

  deterministic-dist:
    name: deterministic dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Rebuild and compare distribution bytes
        run: npm run verify:dist-deterministic

  required:
    name: required
    if: always()
    needs: [verify, deterministic-dist]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
          DIST_RESULT: ${{ needs.deterministic-dist.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$DIST_RESULT" = success
